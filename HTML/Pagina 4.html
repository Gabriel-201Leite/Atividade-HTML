        <section>
             <h2>Guia de Combate e Furtividade: A Arte de Continuar Vivo </h2>
             <h3>Entendendo a Furtividade (A Tecla C)</h3>
             <p>Em Project Zomboid, a melhor luta é aquela que você consegue evitar. O barulho é o seu maior inimigo. Ao pressionar a tecla C, seu personagem entra no modo agachado, reduzindo drasticamente o som dos seus passos e a chance de ser avistado pelos mortos-vivos.</p>
             <p>Antes de entrar em qualquer área urbana ou abrir uma porta, agache-se. Use os cantos das paredes e as cercas para quebrar a linha de visão dos zumbis. Se uma horda começar a te seguir, corra por dentro de uma casa e saia pela porta dos fundos: os zumbis vão perder tempo atacando as janelas e você conseguirá despistá-los.</p>
             <hr>
             <h3>Combate Corpo a Corpo (Melee)</h3>
             <p>Quando o confronto for inevitável, você precisará de uma boa arma branca. O segredo do combate corpo a corpo é o controle de espaço e a paciência. Sempre lute recuando (andando para trás enquanto golpeia) para evitar que os zumbis cheguem perto o suficiente para morder você.</p>
             <p>As armas são divididas em categorias principais:</p>
             <ul>
                <li>Armas Curtas de Esmagamento (Short Blunt): Martelos, chaves inglesas e canos de ferro. São fáceis de encontrar, gastam pouca energia do personagem e não quebram facilmente. O martelo é excelente porque também serve para construir sua base.</li>
                <li>Armas Longas de Esmagamento (Long Blunt): O clássico Taco de Beisebol e o Pé de Cabra. Eles possuem um excelente alcance e um alto poder de derrubada, permitindo que você jogue os zumbis no chão com poucos golpes para finalizá-los pisoteando a cabeça (pressionando a barra de espaço).</li>
                <li>Armas de Corte (Bladed/Axes): Machados de bombeiro e facas de cozinha. O machado causa o maior dano por golpe do jogo, conseguindo eliminar zumbis instantaneamente. O ponto negativo é que eles cansam o personagem muito rápido e destroem as roupas dos zumbis (o que impede você de coletar tecidos inteiros).</li>
             </ul>
             <hr>
             <h3>O Perigo das Armas de Fogo</h3>
             <p>As armas de fogo (pistolas, escopetas e rifles) parecem a solução perfeita, mas na verdade são uma armadilha mortal para iniciantes.</p>
             <p>Se você disparar uma arma de fogo sem ter níveis altos na habilidade de Pontaria, seu personagem vai errar quase todos os tiros. Para piorar, o estrondo do disparo funciona como um imã gigante: ele vai ecoar por bairros inteiros e atrair milhares de zumbis diretamente para a sua posição. Use armas de fogo apenas em situações extremas, quando tiver munição de sobra para limpar a horda que você mesmo atraiu, ou quando estiver longe da sua base principal.</p>
             <h3>Dicas de Combate para Sobreviventes</h3>
             <ul>
                <li>Regra dos Dois Segundos: Nunca tente lutar contra mais de dois ou três zumbis ao mesmo tempo no início do jogo. Se uma horda te avistar, ande calmamente (você anda mais rápido do que os zumbis padrões) e faça-os te seguir por uma cerca ou janela. Quando eles pulam esses obstáculos, eles caem no chão, ficando vulneráveis a pisões na cabeça.</li>
                <li>Cuidado com as Costas: O jogo possui um sistema de audição realista. Se você estiver focado lutando contra um zumbi na sua frente, um segundo pode surgir em silêncio por trás. Gire a câmera constantemente e use o botão direito do mouse para mirar ao redor e escanear o ambiente.</li>
                <li>Monitore a Exaustão: Se o ícone de exaustão física (um pulmãozinho vermelho) aparecer na sua tela, pare de lutar imediatamente. Seu dano cairá pela metade e seus golpes ficarão lentos. Sente-se no chão para descansar ou fuja do local.</li>

             </ul>
